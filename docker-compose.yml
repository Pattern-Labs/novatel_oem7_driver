services:
  novatel:
    image: ros2-novatel-driver
    build:
      context: .
      dockerfile: docker/Dockerfile.build
    network_mode: host
    privileged: true
    devices:
      - /dev/ttyUSB0
      - /dev/ttyUSB1
      - /dev/ttyUSB2
    volumes:
      - /dev:/dev
      - /lib/firmware:/lib/firmware
      - /tmp/.X11-unix:/tmp/.X11-unix
    entrypoint: [ "/bin/bash", "-c", "ros2 launch /ros_ws/src/src/novatel_oem7_driver/launch/oem7_file.launch.py oem7_file_name:=/dev/ttyUSB0" ]
